name: PM 법안 트래커 일일 체크

on:
  schedule:
    # UTC 기준 00:00, 08:00 = 한국시간 09:00, 17:00
    - cron: "0 1,8 * * *"
  workflow_dispatch:   # GitHub 화면에서 수동 실행도 가능

permissions:
  contents: write      # 상태 파일 커밋·푸시에 필요

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r automation/requirements.txt

      # [임시] 이 브랜치에서는 정당 전수 대조만 수행한다.
      - name: 정당 전수 대조
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: python automation/audit_parties.py

