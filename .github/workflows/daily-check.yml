name: PM 법안 트래커 일일 체크

on:
  schedule:
    # 한국시간 10:00, 17:00 (KST=UTC+9 이므로 UTC 01:00, 08:00)
    # GitHub 예약 실행은 정시를 보장하지 않는다 — 러너가 붐비면 밀리고,
    # 실제로 2026-08-12에는 01:00 UTC 예정분이 03:19 UTC에 떴다(2시간 20분 지연).
    # 정시성이 필요하면 Actions 화면에서 수동 실행(workflow_dispatch)해야 한다.
    - cron: "0 1,8 * * *"
  workflow_dispatch:   # GitHub 화면에서 수동 실행도 가능

permissions:
  contents: write      # 상태 파일 커밋·푸시에 필요

# 입법예고 감시(notice-check.yml)와 같은 그룹을 쓴다. 둘 다 master에 푸시하는데,
# 겹쳐 돌면 나중 쪽이 낡은 기준으로 푸시해 거부당한다(2026-08-24에 그렇게 깨졌다).
# cancel-in-progress: false — 상태 갱신은 건너뛰면 안 되니 취소가 아니라 대기시킨다.
concurrency:
  group: push-to-master
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          # 얕은 클론이면 푸시 거부 뒤 리베이스할 때 공통 조상을 못 찾을 수 있다.
          fetch-depth: 0

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r automation/requirements.txt

      - name: 변경 감지 실행
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python automation/cloud_check_updates.py

      - name: 상태 파일 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/
          if git diff --cached --quiet; then
            echo "상태 변화 없음 - 커밋 생략"
            exit 0
          fi
          git commit -m "Routine check: state update only"

          # 체크아웃 시점과 푸시 시점 사이에 누가 master에 푸시하면 거부당한다.
          # 거부되면 원격을 당겨와 이 커밋을 그 위에 다시 얹고 재시도한다.
          # 여기서 푸시를 못 하면 상태 파일이 러너와 함께 사라지는데, 슬랙 알림은
          # 이미 나간 뒤라 다음 실행이 같은 건을 또 알리게 된다.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              echo "상태 파일 갱신 완료"
              exit 0
            fi
            echo "푸시 거부 - 원격을 당겨와 다시 얹는다 ($attempt/5)"
            if ! git pull --rebase origin master; then
              git rebase --abort || true
              echo "리베이스 충돌 - 사람이 봐야 한다. 상태 파일은 저장되지 않았다."
              exit 1
            fi
            sleep $((attempt * 2))
          done
          echo "5번 시도했지만 푸시하지 못했다. 상태 파일은 저장되지 않았다."
          exit 1
