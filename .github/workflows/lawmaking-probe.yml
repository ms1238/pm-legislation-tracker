# 입법예고(국민참여입법센터) API 진단용 — 손으로만 실행한다.
# 상태 파일을 쓰지 않고 커밋도 슬랙 알림도 하지 않는다. 읽고 출력만 한다.
# lawmaking.go.kr 은 개발 컨테이너에서 막혀 있어, 실측은 러너에서만 가능하다.
name: 입법예고 API 진단

on:
  workflow_dispatch:
    inputs:
      oc:
        description: "OC(승인 아이디). 비우면 secrets.LAWMAKING_OC 를 쓴다. 로그에서는 가려진다."
        required: false
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: OC 결정 및 로그 마스킹
        id: oc
        env:
          INPUT_OC: ${{ inputs.oc }}
          SECRET_OC: ${{ secrets.LAWMAKING_OC }}
        run: |
          OC="${INPUT_OC:-$SECRET_OC}"
          # 이 저장소는 퍼블릭이라 실행 로그도 공개된다. 입력으로 받은 OC는
          # 자동 마스킹 대상이 아니므로 여기서 직접 가린다.
          echo "::add-mask::$OC"
          echo "oc=$OC" >> "$GITHUB_OUTPUT"
          if [ -z "$OC" ]; then echo "OC 없음 — 인증 필요한 호출은 실패할 수 있다"; fi

      - name: 입법예고 API 진단
        env:
          LAWMAKING_OC: ${{ steps.oc.outputs.oc }}
        run: python automation/lawmaking_probe.py
