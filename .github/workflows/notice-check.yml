# 입법예고 감시 — 킥보드·개인형 이동장치·자전거·전기자전거 관련 예고가 뜨면 슬랙으로 알린다.
#
# 첫 실행은 진행중인 예고 전부의 본문을 읽는다(200건대, 몇 분 걸린다).
# 그 뒤로는 새로 올라온 건만 읽으므로 1분 안에 끝난다.
#
# 이 워크플로가 하는 일은 "새로 뜬 것을 찾아 알리는 것"까지다. 페이지의 정부 입법예고
# 탭에 올릴지는 사람이 정한다 — 알림을 보고 판단한 뒤 automation/notices.json 에서
# 해당 건의 followup 을 true 로 바꾸면 그때 탭에 나온다.
#
# 정부 입법예고(부처)와 국회 입법예고를 함께 본다. 국회에 접수된 의안의 심사 진행은
# 같은 저장소의 cloud_check_updates.py 가 따로 본다 — 여기는 예고 단계만이다.
#
# 필요한 저장소 시크릿:
#   LAWMAKING_OC       국민참여입법센터 정보공개 승인 아이디
#   ASSEMBLY_API_KEY   국회 Open API 키 (일일 체크와 같은 값을 쓴다)
#   SLACK_WEBHOOK_URL  알림 보낼 채널 (일일 체크와 같은 값을 쓴다)
name: 입법예고 감시

on:
  schedule:
    # 한국시간 09:30 (KST=UTC+9 이므로 UTC 00:30). 하루 한 번.
    # 입법예고 의견제출 기간은 보통 40일이라 하루 단위면 충분히 여유가 있다.
    # GitHub 예약 실행은 정시를 보장하지 않는다 — 밀려도 다음 실행이 이어서 본다.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "이번 실행에서 본문을 읽을 최대 건수(비우면 제한 없음)"
        required: false
        type: string
      dry_run:
        description: "슬랙 전송과 상태 저장 없이 판정만 본다"
        required: false
        type: boolean
        default: false

permissions:
  contents: write      # 상태 파일 커밋·푸시에 필요

# 일일 체크(daily-check.yml)와 같은 그룹을 쓴다. 둘 다 master에 푸시하는데,
# 이쪽은 첫 훑기가 10분대라 예약이 밀리면 일일 체크와 겹친다. 겹치면 나중 쪽이
# 낡은 기준으로 푸시해 거부당한다(2026-08-24에 그렇게 깨졌다).
# cancel-in-progress: false — 상태 갱신은 건너뛰면 안 되니 취소가 아니라 대기시킨다.
concurrency:
  group: push-to-master
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # 상대 서버가 응답을 멈추면 재시도만 하다 몇 시간을 태운다. 정상 실행은
    # 첫 훑기가 10분대, 그 뒤로는 1분 안이라 40분이면 넉넉하다.
    timeout-minutes: 40
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          # 얕은 클론이면 푸시 거부 뒤 리베이스할 때 공통 조상을 못 찾을 수 있다.
          fetch-depth: 0

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 입법예고 감시
        env:
          # 버퍼링 때문에 로그가 통째로 사라지는 일을 막는다. 스크립트도 flush 하지만
          # 트레이스백처럼 스크립트가 손대지 않는 출력까지 덮으려면 이쪽이 필요하다.
          PYTHONUNBUFFERED: "1"
          LAWMAKING_OC: ${{ secrets.LAWMAKING_OC }}
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python automation/notice_watch.py $ARGS

      - name: 상태 파일 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/notice_state.json automation/notices.json
          if git diff --cached --quiet; then
            echo "상태 변화 없음 - 커밋 생략"
            exit 0
          fi
          git commit -m "입법예고 감시: 상태·페이지 목록 갱신"

          # 체크아웃 시점과 푸시 시점 사이에 누가 master에 푸시하면 거부당한다.
          # 거부되면 원격을 당겨와 이 커밋을 그 위에 다시 얹고 재시도한다.
          # 여기서 푸시를 못 하면 본 것이 저장되지 않아 다음 실행이 같은 예고를
          # 새 것으로 보고 또 알린다.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              echo "상태 파일 갱신 완료"
              exit 0
            fi
            echo "푸시 거부 - 원격을 당겨와 다시 얹는다 ($attempt/5)"
            if ! git pull --rebase origin master; then
              git rebase --abort || true
              echo "리베이스 충돌 - 사람이 봐야 한다. 상태 파일은 저장되지 않았다."
              exit 1
            fi
            sleep $((attempt * 2))
          done
          echo "5번 시도했지만 푸시하지 못했다. 상태 파일은 저장되지 않았다."
          exit 1
