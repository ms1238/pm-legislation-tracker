# 국회 일정 조회 진단용 — 손으로만 실행한다.
# 상태 파일을 쓰지 않고 커밋도 슬랙 알림도 하지 않는다. 읽고 출력만 한다.
name: 국회 일정 조회 진단

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 일정 조회 진단
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: python automation/schedule_debug.py

      # (임시) 입법예고 API 진단. workflow_dispatch 는 워크플로 파일이 기본 브랜치에
      # 있어야 호출되므로, 새로 만든 lawmaking-probe.yml 은 아직 dispatch 할 수 없다.
      # 그래서 이 브랜치에서만 여기에 얹어 한 번 돌리고, 확인이 끝나면 걷어낸다.
      - name: 러너 공인 IP (법제처 계열은 등록 IP로 호출자를 검증한다)
        run: curl -s --max-time 10 https://api.ipify.org || true

      - name: 입법예고 API 진단
        env:
          LAWMAKING_OC: ${{ secrets.LAWMAKING_OC }}
        run: python automation/lawmaking_probe.py
