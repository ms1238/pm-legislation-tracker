# 진단용 — 손으로만 실행한다.
# 상태 파일을 쓰지 않고 커밋도 슬랙 알림도 하지 않는다. 읽고 출력만 한다.
name: 진단 (국회 일정 · 입법예고)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "무엇을 볼지"
        required: true
        default: ping
        type: choice
        options:
          - ping          # 입법예고 서버가 러너에서 닿는지 한 건만 물어본다
          - probe         # 목록을 쪽 크기별로 재 본다(어느 크기부터 막히는지)
          - inspect       # 입법예고 한 건을 열어 본문·첨부 판정을 본다
          - sweep         # 감시를 통째로 시험 실행한다(슬랙·상태파일 없이)
          - schedule      # 국회 일정 조회 진단
      seq:
        description: "inspect 일 때 열어볼 입법예고 번호(ogLmPpSeq)"
        required: false
        type: string
      limit:
        description: "sweep 일 때 읽을 최대 건수(비우면 제한 없음)"
        required: false
        type: string

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 국회 일정 조회 진단
        if: ${{ inputs.mode == 'schedule' }}
        env:
          PYTHONUNBUFFERED: "1"
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: python automation/schedule_debug.py

      # 아래 셋은 저장소 시크릿의 OC를 쓴다. 입력으로 받으면 실행 기록에 값이
      # 그대로 남아서, 시크릿이 있는 지금은 그럴 이유가 없다.
      - name: 입법예고 서버 확인(한 건만)
        if: ${{ inputs.mode == 'ping' }}
        env:
          PYTHONUNBUFFERED: "1"
          LAWMAKING_OC: ${{ secrets.LAWMAKING_OC }}
        run: python automation/notice_watch.py --ping

      - name: 목록 쪽 크기 재보기
        if: ${{ inputs.mode == 'probe' }}
        env:
          PYTHONUNBUFFERED: "1"
          LAWMAKING_OC: ${{ secrets.LAWMAKING_OC }}
        run: python automation/notice_watch.py --probe

      - name: 입법예고 한 건 열어보기
        if: ${{ inputs.mode == 'inspect' }}
        env:
          PYTHONUNBUFFERED: "1"
          LAWMAKING_OC: ${{ secrets.LAWMAKING_OC }}
        run: python automation/notice_watch.py --inspect "${{ inputs.seq }}"

      - name: 감시 시험 실행(슬랙·상태파일 없이)
        if: ${{ inputs.mode == 'sweep' }}
        env:
          PYTHONUNBUFFERED: "1"
          LAWMAKING_OC: ${{ secrets.LAWMAKING_OC }}
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: |
          ARGS="--dry-run"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python automation/notice_watch.py $ARGS
